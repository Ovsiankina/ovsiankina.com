<title>XIAO ESP32-C3 ASCII</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Unbounded:wght@300;500&display=swap">
<style>
/* Layout: two equal stages side by side (pixel render | colour ASCII), stacked on phones; one quiet control row underneath.
   Single dark look by choice. Material and accent colours come from CFG and are set as CSS vars at boot. */
:root {
  --bg: #0d0e12;
  --panel: #12131a;
  --line: #272935;
  --fg: #e7e5ee;
  --muted: #8c8b9b;
  --accent: #e3b86a;
  --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --display: "Unbounded", "Avenir Next", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--mono); padding-inline: 16px; padding-block: 28px 40px; }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
h1 { font-family: var(--display); font-weight: 300; font-size: clamp(20px, 3vw, 30px); margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 b { font-weight: 500; color: var(--accent); }
.meta { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; display: flex; gap: 10px; flex-wrap: wrap; }
.meta span { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-variant-numeric: tabular-nums; }
.stages { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); }
.stage { position: relative; aspect-ratio: 5 / 4; max-width: 100%; overflow: hidden; background: var(--panel); cursor: grab; touch-action: none; min-width: 0; }
.stage + .stage { border-left: 1px solid var(--line); }
.stage:active { cursor: grabbing; }
.tag { position: absolute; left: 10px; top: 8px; font-size: 10px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; pointer-events: none; z-index: 2; }
#px { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; }
.ascii { position: absolute; inset: 0; }
.ascii pre { position: absolute; left: 0; top: 0; margin: 0; white-space: pre; font-family: var(--mono); line-height: 1; letter-spacing: 0; pointer-events: none; }
.ascii pre.glint { font-weight: 500; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; font-size: 12px; color: var(--muted); }
.controls label { display: flex; align-items: center; gap: 10px; letter-spacing: .06em; text-transform: uppercase; font-size: 10px; }
input[type=range] { width: 140px; accent-color: var(--accent); }
button { font: inherit; font-size: 12px; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; min-height: 34px; }
button:hover { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
#toast { min-height: 1em; }
.hint { margin-left: auto; }
@media (max-width: 760px) {
  .stages { grid-template-columns: minmax(0, 1fr); }
  .stage + .stage { border-left: 0; border-top: 1px solid var(--line); }
  .hint { margin-left: 0; }
}
</style>

<div class="wrap">
  <header>
    <h1 id="ttl"></h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="stages">
    <div class="stage" id="s3d" role="img">
      <span class="tag">render · 3 px grid</span>
      <canvas id="px"></canvas>
    </div>
    <div class="stage" id="sAscii" role="img">
      <span class="tag">ascii · colour layers</span>
      <div class="ascii" id="ascii" aria-hidden="true"></div>
    </div>
  </div>
  <div class="controls">
    <button type="button" id="play">Pause</button>
    <label for="fs">ASCII size <input type="range" id="fs" min="6" max="16" step="1" value="10"></label>
    <button type="button" id="copy">Copy ASCII frame</button>
    <span id="toast" role="status"></span>
    <span class="hint" id="hint"></span>
  </div>
</div>

    raster(TA, yaw, pitch, Math.min(sA.clientWidth, sA.clientHeight) / (2 * R));
    const W2 = cols * 2, { mat, lum, spc, z } = TA, cnt = new Uint8Array(NM + 1), dep = grid.dep;
    grid.ch.fill(32); grid.m.fill(0); dep.fill(-1e9);
    // pass 1: fill from the shading ramp, majority material per cell
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      cnt.fill(0); let sl = 0, sp = 0, n = 0, sz = 0;
      for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) {
        const i = (2 * r + dy) * W2 + 2 * c + dx, m = mat[i];
        if (!m) continue; cnt[m]++; sl += lum[i]; sp = Math.max(sp, spc[i]); n++; sz += z[i];
      }
      if (!n) continue;
      const g = c + r * cols;
      dep[g] = sz / n;
      let best = 1; for (let k = 2; k <= NM; k++) if (cnt[k] > cnt[best]) best = k;
      const q = Math.max(0, Math.min(RAMP.length - 1, Math.floor((sl / 4) * (RAMP.length - 1) + 0.4 + (hsh(c, r) - 0.5) * 0.3)));
      const ch = q === 0 ? (n >= 2 ? 46 : 32) : RAMP.charCodeAt(q);
      grid.base[g] = LAYER[best];
      if (ch === 32) continue;
      grid.ch[g] = ch; grid.m[g] = (METAL[best] && sp > 0.5) ? GLINT : LAYER[best];
    }
    // pass 2: line characters where neighbours drop away (silhouette or a step bigger than the surface's own slope)
    const STEP = C.edgeStep;
    const at = (rr, cc) => (rr < 0 || cc < 0 || rr >= rows || cc >= cols) ? -1e9 : dep[cc + rr * cols];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const g = c + r * cols, zc = dep[g];
      if (zc < -1e8) continue;
      let nx = 0, ny = 0, k = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const zn = at(r + dy, c + dx), zo = at(r - dy, c - dx);
        if (zn < -1e8 || (zo > -1e8 ? 2 * zc - zn - zo > STEP : zc - zn > STEP * 1.6)) { nx += dx; ny += dy; k++; }
      }
      if (!k || (nx === 0 && ny === 0)) continue;
      const o = ((Math.atan2(ny * cellH, nx * cellW) * 180 / Math.PI) + 360) % 180; // normal toward the far side
      grid.ch[g] = o < 22.5 || o >= 157.5 ? 124 : o < 67.5 ? 92 : o < 112.5 ? (ny > 0 ? 95 : 45) : 47; // | \ _ - /
      grid.m[g] = grid.base[g];
    }
    for (let m = 1; m <= pres.length; m++) {
      let out = '';
      for (let r = 0; r < rows; r++) {
        let line = '', last = -1;
        for (let c = cols - 1; c >= 0; c--) if (grid.m[r * cols + c] === m) { last = c; break; }
        for (let c = 0; c <= last; c++) { const g = r * cols + c; line += grid.m[g] === m ? String.fromCharCode(grid.ch[g]) : ' '; }
        out += line + '\n';
      }
      pres[m - 1].textContent = out;
    }
  }

  // ---------- motion + input ----------
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const st = { yaw: C.yaw ?? -0.7, pitch: C.pitch, ph: 0, playing: !reduced, drag: null, last: 0 };
  const SPIN = 2 * Math.PI / C.spinSeconds; // yaw per second; pitch tumbles at half that rate between +tilt and -tilt
  const playBtn = document.getElementById('play');
  const syncBtn = () => { playBtn.textContent = st.playing ? 'Pause' : 'Play'; };
  syncBtn();
  playBtn.onclick = () => { st.playing = !st.playing; syncBtn(); };
  [s3d, sA].forEach(el => {
    el.addEventListener('pointerdown', e => { st.drag = { x: e.clientX, y: e.clientY }; el.setPointerCapture(e.pointerId); });
    el.addEventListener('pointermove', e => {
      if (!st.drag) return;
      st.yaw += (e.clientX - st.drag.x) * 0.01;
      st.pitch = Math.max(-1.45, Math.min(1.45, st.pitch + (e.clientY - st.drag.y) * 0.01));
      st.drag = { x: e.clientX, y: e.clientY };
    });
    const up = () => { st.drag = null; };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  });
  const fs = document.getElementById('fs');
  fs.oninput = () => { fontPx = +fs.value; layout(); };
  document.getElementById('copy').onclick = () => {
    const toast = document.getElementById('toast');
    let txt = '';
    for (let r = 0; r < rows; r++) { let line = ''; for (let c = 0; c < cols; c++) line += String.fromCharCode(grid.ch[r * cols + c]); txt += line.replace(/\s+$/, '') + '\n'; }
    Promise.resolve().then(() => navigator.clipboard.writeText(txt)).then(() => { toast.textContent = 'Frame copied'; }, () => { toast.textContent = 'Clipboard blocked by the viewer'; });
  };
  let lastA = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - (st.last || now)) / 1000); st.last = now;
    if (st.playing && !st.drag) {
      st.yaw += SPIN * dt; st.ph += SPIN * 0.5 * dt;
      const goal = C.tilt ? C.tilt * Math.cos(st.ph) : C.pitch;
      st.pitch += (goal - st.pitch) * Math.min(1, dt * 3);
    }
    draw3d(st.yaw, st.pitch);
    if (now - lastA > 1000 / C.asciiFps) { drawAscii(st.yaw, st.pitch); lastA = now; }
    requestAnimationFrame(frame);
  }
  window.CAD_ASCII = { st, draw: () => { draw3d(st.yaw, st.pitch); drawAscii(st.yaw, st.pitch); } }; // hook for headless screenshots
  let rt = 0;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 80); });
  const start = () => { layout(); requestAnimationFrame(frame); };
  document.fonts.ready.then(start, start);
})();
</script>
