<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizon Glow</title>
<style>
  html { background: #000; }
  body { margin: 0; min-height: 100%; }  /* keep body transparent so the z-index:-1 canvas shows */
  #horizon-glow {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    z-index: -1;
    image-rendering: pixelated;   /* keeps the low-res dithered GIF look */
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="horizon-glow"></canvas>

<script>
(() => {
  // ---------- config ----------
  const CONFIG = {
    pixelSize: 3,          // render at 1/N resolution; 1 = smooth, 3-4 = GIF-like
    levels: 7,             // intensity quantization steps (lower = more posterized)
    center: [0.5, 0.55],   // horizon position, fraction of viewport (x, y from bottom)
    width: 0.85,           // half-width of the glow, in viewport-height units
    height: 0.32,          // glow height above the line
    reflect: 0.15,         // glow depth below the line
    // cycle timings in seconds: idle -> rise -> hold -> fade -> idle
    idle: 1.6, rise: 0.9, hold: 3.2, fade: 2.0, tail: 0.6,
  };
  // ----------------------------

  const canvas = document.getElementById('horizon-glow');
  const gl = canvas.getContext('webgl', { antialias: false, premultipliedAlpha: false, preserveDrawingBuffer: true });
  if (!gl) return; // body stays black

  const vert = `
    attribute vec2 a;
    void main() { gl_Position = vec4(a, 0.0, 1.0); }
  `;

  const frag = `
    precision highp float;
    uniform vec2  uRes;
    uniform float uTime;
    uniform float uEnv;      // 0..1 overall intensity envelope
    uniform float uGrow;     // 0..1 horizontal expansion
    uniform vec2  uCenter;
    uniform float uW, uH, uR, uLevels;

    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x),
                 mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
    }
    float fbm(vec2 p) {
      float v = 0.0, a = 0.5;
      for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; }
      return v;
    }
    // 4x4 ordered Bayer threshold in [0,1)
    float bayer4(vec2 p) {
      vec2 q = mod(floor(p), 4.0);
      int i = int(q.x + q.y * 4.0);
      float m[16];
      m[0]=0.;m[1]=8.;m[2]=2.;m[3]=10.;m[4]=12.;m[5]=4.;m[6]=14.;m[7]=6.;
      m[8]=3.;m[9]=11.;m[10]=1.;m[11]=9.;m[12]=15.;m[13]=7.;m[14]=13.;m[15]=5.;
      for (int k = 0; k < 16; k++) if (k == i) return (m[k] + 0.5) / 16.0;
      return 0.5;
    }
    vec3 ramp(float x) {
      vec3 c0 = vec3(0.0);
      vec3 c1 = vec3(0.16, 0.03, 0.07);   // deep maroon
      vec3 c2 = vec3(0.50, 0.20, 0.30);
      vec3 c3 = vec3(0.82, 0.45, 0.54);   // pink
      vec3 c4 = vec3(0.92, 0.84, 0.64);   // pale gold core
      if (x < 0.2)  return mix(c0, c1, x / 0.2);
      if (x < 0.45) return mix(c1, c2, (x - 0.2) / 0.25);
      if (x < 0.75) return mix(c2, c3, (x - 0.45) / 0.30);
      return mix(c3, c4, clamp((x - 0.75) / 0.22, 0.0, 1.0));
    }

    void main() {
      vec2 p = (gl_FragCoord.xy - uRes * uCenter) / uRes.y;
      float t = uTime;
      float e = uEnv;

      float w  = uW * mix(0.35, 1.0, uGrow);
      float nx = p.x / w;
      float ax = abs(nx);

      // ragged vertical streaks along the top edge
      float streak = fbm(vec2(p.x * 14.0, t * 0.35));
      float fine   = noise(vec2(p.x * 90.0, t * 1.5));

      float I = 0.0;
      if (ax < 1.25) {
        float corner = sqrt(max(0.0, 1.0 - pow(min(ax, 1.0), 5.0)));
        if (p.y > 0.0) {
          float h = uH * e * corner * (0.78 + 0.32 * streak);
          float v = p.y / max(h, 1e-4);
          float body = 1.0 - smoothstep(0.5, 1.0, v);
          float halo = exp(-v * 1.4) * 0.35;
          I = (body * 0.55 + halo) * (0.88 + 0.12 * fine);
        } else {
          float h = uR * e * sqrt(max(0.0, 1.0 - ax * ax * 0.85));
          float v = -p.y / max(h, 1e-4);
          I = exp(-v * v * 1.3) * 0.6 + exp(-v * 1.2) * 0.2;
        }
        I *= 1.0 - smoothstep(0.78, 1.12, ax);   // soft side falloff
        I *= e;
      }

      // bright core hugging the horizon
      float core = exp(-abs(p.y) / (0.008 + 0.006 * e)) * (1.0 - smoothstep(0.55, 1.05, ax));
      I += core * 0.4 * e;

      // thin horizon line, wider than the glow
      float lineMask = 1.0 - smoothstep(0.7, 1.35, ax);
      float line = exp(-abs(p.y) * uRes.y / 2.5) * lineMask;
      I += line * 0.9 * smoothstep(0.0, 0.3, e);

      I = clamp(I, 0.0, 1.0);

      // posterize with ordered dither
      float q = floor(I * uLevels + bayer4(gl_FragCoord.xy)) / uLevels;
      gl_FragColor = vec4(ramp(clamp(q, 0.0, 1.0)), 1.0);
    }
  `;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, vert));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const U = n => gl.getUniformLocation(prog, n);
  const uRes = U('uRes'), uTime = U('uTime'), uEnv = U('uEnv'), uGrow = U('uGrow');
  gl.uniform2fv(U('uCenter'), CONFIG.center);
  gl.uniform1f(U('uW'), CONFIG.width);
  gl.uniform1f(U('uH'), CONFIG.height);
  gl.uniform1f(U('uR'), CONFIG.reflect);
  gl.uniform1f(U('uLevels'), CONFIG.levels);

  function resize() {
    const w = Math.max(1, Math.floor(innerWidth  / CONFIG.pixelSize));
    const h = Math.max(1, Math.floor(innerHeight / CONFIG.pixelSize));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
    gl.uniform2f(uRes, w, h);
  }
  addEventListener('resize', resize);
  resize();

  const easeOut = x => 1 - Math.pow(1 - x, 3);
  const easeIn  = x => x * x;
  const C = CONFIG;
  const period = C.idle + C.rise + C.hold + C.fade + C.tail;

  // returns [envelope, growth] for a time in the loop
  function envelope(time) {
    let x = time % period;
    if ((x -= C.idle) < 0) return [0, 0];
    if (x < C.rise) { const k = easeOut(x / C.rise); return [k, k]; }
    if ((x -= C.rise) < C.hold) {
      const flicker = 0.93 + 0.07 * Math.sin(x * 23.0) * Math.sin(x * 7.3);
      return [flicker, 1];
    }
    if ((x -= C.hold) < C.fade) return [1 - easeIn(x / C.fade), 1];
    return [0, 1];
  }

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const frozen = new URLSearchParams(location.search).get('t'); // e.g. ?t=3 to freeze a frame
  const start = performance.now();

  function frame(now) {
    const time = frozen !== null ? parseFloat(frozen)
               : reduced ? C.idle + C.rise + 1.0
               : (now - start) / 1000;
    const [e, g] = envelope(time);
    gl.uniform1f(uTime, time);
    gl.uniform1f(uEnv, e);
    gl.uniform1f(uGrow, g);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    if (frozen === null && !reduced) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
