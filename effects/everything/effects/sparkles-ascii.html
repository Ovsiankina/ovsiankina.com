<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chrome Sparkles ASCII</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Unbounded:wght@300;500&display=swap">
<style>
/* Layout: dark specimen sheet, 5x3 grid mirroring the source pack, click a cell to inspect it large */
:root {
  --bg: #0b0a0f;
  --panel: #13121a;
  --line: #2a2735;
  --fg: #e9e4f2;
  --muted: #8d869e;
  --holo: linear-gradient(115deg, #f6c6ea 0%, #cdb8ff 25%, #a9e3f5 50%, #c9f2d9 70%, #f6c6ea 100%);
  --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --display: "Unbounded", "Avenir Next", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--mono); padding-inline: 16px; padding-block: 28px 48px; }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 22px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
h1 { font-family: var(--display); font-weight: 300; font-size: clamp(22px, 3.2vw, 34px); margin: 0; letter-spacing: .01em;
     background: var(--holo); -webkit-background-clip: text; background-clip: text; color: transparent; }
.meta { color: var(--muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; display: flex; gap: 14px; flex-wrap: wrap; }
.meta span { border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border: 1px solid var(--line); }
.cell { position: relative; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); aspect-ratio: 1; max-width: 100%;
        display: grid; place-items: center; overflow: hidden; cursor: pointer; background: none; color: inherit; padding: 0; font: inherit; }
.cell:nth-child(5n) { border-right: 0; }
.cell:nth-last-child(-n+5) { border-bottom: 0; }
.cell:hover, .cell:focus-visible, .cell.sel { background: var(--panel); outline: none; }
.cell:focus-visible { box-shadow: inset 0 0 0 1px #cdb8ff; }
.cell .tag { position: absolute; left: 8px; top: 6px; font-size: 10px; color: var(--muted); letter-spacing: .08em; }
pre.art { margin: 0; line-height: 1.2; white-space: pre; font-family: var(--mono);
          background: var(--holo); background-size: 200% 200%; -webkit-background-clip: text; background-clip: text; color: transparent;
          animation: sheen 9s linear infinite; }
@keyframes sheen { from { background-position: 0% 50%; } to { background-position: 200% 50%; } }
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 0; border: 1px solid var(--line); background: var(--panel); }
.view { overflow-x: auto; display: grid; place-items: center; padding: 24px 12px; min-height: 360px; min-width: 0; }
.view pre.art { font-size: clamp(6px, 1.25vw, 13px); }
.side { border-left: 1px solid var(--line); padding: 18px; display: grid; gap: 16px; align-content: start; font-size: 12px; }
.side h2 { font-family: var(--display); font-weight: 500; font-size: 15px; margin: 0; }
.row { display: grid; gap: 6px; }
.row label { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 10px; }
input[type=range] { width: 100%; accent-color: #cdb8ff; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
button.b { font: inherit; font-size: 12px; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
button.b:hover { border-color: #cdb8ff; }
button.b:focus-visible { outline: 1px solid #cdb8ff; outline-offset: 2px; }
.dim { color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 860px) {
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cell:nth-child(5n) { border-right: 1px solid var(--line); }
  .cell:nth-child(3n) { border-right: 0; }
  .cell:nth-last-child(-n+5) { border-bottom: 1px solid var(--line); }
  .stage { grid-template-columns: 1fr; }
  .side { border-left: 0; border-top: 1px solid var(--line); }
}
@media (prefers-reduced-motion: reduce) { pre.art { animation: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Chrome Sparkles, in ASCII</h1>
    <div class="meta"><span>15 loops</span><span>36 frames / 360°</span><span>line glyphs only</span></div>
  </header>

  <section class="stage" aria-label="Selected sparkle">
    <div class="view"><pre class="art" id="big"></pre></div>
    <div class="side">
      <h2 id="name"></h2>
      <div class="dim" id="dims"></div>
      <div class="row"><label for="fps">Speed <span class="dim" id="fpsv"></span></label><input id="fps" type="range" min="2" max="30" value="12"></div>
      <div class="row"><label for="scrub">Frame <span class="dim" id="frv"></span></label><input id="scrub" type="range" min="0" max="35" value="0"></div>
      <div class="btns">
        <button class="b" id="play">Pause</button>
        <button class="b" id="copy">Copy frame</button>
        <button class="b" id="copyall">Copy all frames (JSON)</button>
      </div>
      <div class="dim" id="toast" aria-live="polite"></div>
    </div>
  </section>

  <section class="grid" id="grid" aria-label="All sparkles"></section>
</div>

const S = DATA.sparkles;
let sel = 0, playing = true, fps = 12, frame = 0, last = 0;
const grid = document.getElementById('grid');
const big = document.getElementById('big');
const tiles = S.map((s, i) => {
  const b = document.createElement('button');
  b.className = 'cell'; b.id = 'cell' + i;
  b.setAttribute('aria-label', 'Show ' + s.name);
  b.innerHTML = `<span class="tag">${String(s.id).padStart(2, '0')}</span><pre class="art"></pre>`;
  b.onclick = () => select(i);
  grid.appendChild(b);
  return b.querySelector('pre');
});
function fitTiles() {
  tiles.forEach((pre, i) => {
    const cell = pre.parentElement, s = S[i];
    const w = cell.clientWidth * 0.86, h = cell.clientHeight * 0.86;
    const fs = Math.min(w / (s.width * 0.6), h / (s.height * 1.2));
    pre.style.fontSize = Math.max(2, fs) + 'px';
  });
}
function select(i) {
  sel = i;
  document.querySelectorAll('.cell').forEach((c, k) => c.classList.toggle('sel', k === i));
  const s = S[i];
  document.getElementById('name').textContent = String(s.id).padStart(2, '0') + ' ' + s.name;
  document.getElementById('dims').textContent = `${s.width} × ${s.height} chars · ${s.frames.length} frames`;
  draw();
}
function draw() {
  const f = frame % 36;
  S.forEach((s, i) => { tiles[i].textContent = s.frames[f].join('\n'); });
  big.textContent = S[sel].frames[f].join('\n');
  document.getElementById('scrub').value = f;
  document.getElementById('frv').textContent = f + 1 + ' / 36';
}
function loop(t) {
  if (playing && t - last > 1000 / fps) { frame = (frame + 1) % 36; last = t; draw(); }
  requestAnimationFrame(loop);
}
const fpsEl = document.getElementById('fps');
fpsEl.oninput = () => { fps = +fpsEl.value; document.getElementById('fpsv').textContent = fps + ' fps'; };
fpsEl.oninput();
document.getElementById('scrub').oninput = e => { frame = +e.target.value; playing = false; document.getElementById('play').textContent = 'Play'; draw(); };
document.getElementById('play').onclick = e => { playing = !playing; e.target.textContent = playing ? 'Pause' : 'Play'; };
function copy(text, msg) {
  const t = document.getElementById('toast');
  Promise.resolve().then(() => navigator.clipboard.writeText(text))
    .then(() => t.textContent = msg)
    .catch(() => { const r = document.createRange(); r.selectNodeContents(big); const s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = 'Clipboard blocked: frame selected, press Ctrl+C'; });
}
document.getElementById('copy').onclick = () => copy(S[sel].frames[frame % 36].join('\n'), 'Frame copied');
document.getElementById('copyall').onclick = () => copy(JSON.stringify(S[sel]), 'All frames copied as JSON');
addEventListener('resize', fitTiles);
select(0); fitTiles();
if (matchMedia('(prefers-reduced-motion: reduce)').matches) playing = false, document.getElementById('play').textContent = 'Play';
requestAnimationFrame(loop);
